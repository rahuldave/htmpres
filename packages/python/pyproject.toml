[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "plotfoundry"
version = "0.1.0.dev0"
description = "Independent plotting-package boundary scaffold; plotting APIs are not implemented"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Rahul Dave" }]
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/plotfoundry"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/examples", "/README.md", "/LICENSE", "/pyproject.toml"]
