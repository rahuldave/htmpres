html,
body {

}

}

}

  width: 100%;
  text-align: left;
  border: 1px solid transparent;
  background: transparent;
  color: var(--toc-ink);
  border-radius: 6px;
  padding: 8px 9px;
  cursor: pointer;
  font-size: 0.78rem;
  line-height: 1.25;
}

.toc button:hover,

  outline: none;
  border-color: var(--toc-hover-border);
  background: var(--paper);
}

.toc button.active {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}

.stage-wrap {
  position: relative;
  display: grid;
  align-items: start;
  justify-items: center;
  min-width: 0;
  min-height: 0;
  padding: 14px 26px 8px;
}

.slide-fit {
  width: min(100%, var(--slide-w));
  touch-action: pan-y;
}

.slides {
  width: 100%;
  aspect-ratio: 16 / 9;
  max-height: calc(100vh - 90px);
  max-height: calc(100dvh - 78px);
  position: relative;
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  background: var(--paper);
  overflow: hidden;
}

.slide {
  position: absolute;
  inset: 0;
  display: none;
  padding: var(--htmpres-slide-padding, 48px 58px);
  background: var(--paper);
  overflow: hidden;
}

.slide.active {
  display: block;
}

.slide::after {
  content: attr(data-section);
  position: absolute;
  right: 34px;
  bottom: 28px;
  color: var(--footer-label);
  font-size: var(--foundation-ui-size, 0.72rem);
  letter-spacing: 0.08em;

  margin-top: 20px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--paper);
  padding: 12px;
  height: 440px;
  display: grid;
  place-items: center;
  overflow: hidden;
}

.diagram-frame > img.zoomable {
  display: block;
  width: 100% !important;
  height: 416px !important;
  object-fit: contain !important;
  cursor: zoom-in;
}

.media-caption {
  max-width: 470px;
  margin-top: 128px;
  border: 1px solid var(--caption-border);
  border-radius: var(--radius);
  background: var(--caption-bg);
  box-shadow: var(--caption-shadow);
  padding: 24px;
}

.media-caption h3 {
  margin: 0 0 10px;
  font-size: var(--htmpres-h3-size, 1.55rem);
}

.media-caption p {
  margin: 0;
  color: var(--caption-ink);
}

.ds-pane h3 {
  margin-bottom: 8px;
}

.ds-pane p {
  margin: 0 0 14px;
}

.ds-pane p:last-child {
  margin-bottom: 0;
}

.sample-split .ds-pane {
  min-height: 430px;
}

.sample-media-grid {
  margin-top: 20px;
}

.sample-media-grid .ds-media {
  height: 156px;
  padding: 8px;
  background: var(--paper);
}

.sample-label {
  color: var(--muted);
  font-size: var(--foundation-ui-size, 0.86rem);
  text-align: center;
}

.compact-panel {
  min-height: 116px;
}

.pill-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 22px;
}

.pill {
  border: 1px solid var(--control-border);
  border-radius: var(--radius, 999px);
  background: var(--control-bg);
  color: var(--ink);
  padding: var(--htmpres-ui-padding, 8px 12px);
  cursor: pointer;
  font-size: var(--foundation-ui-size, 0.82rem);
  line-height: var(--foundation-ui-leading, 1);
}

.pill:hover,
.pill:focus-visible {
  outline: var(--htmpres-focus-outline, none);
  border-color: var(--teal);
  color: var(--teal);
}

.pill.active {
  background: var(--foundation-selected-fill, var(--teal));
  color: var(--foundation-selected-ink, var(--paper));
  border-color: var(--teal);
}

.button-samples {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-top: 22px;
}

.control-chip,
.action-button {
  border: 1px solid var(--control-border);
  cursor: pointer;
  font-size: var(--foundation-ui-size, 0.82rem);
  line-height: var(--foundation-ui-leading, 1);
}

.control-chip {
  border-radius: var(--radius, 999px);
  background: var(--control-subtle-bg);
  color: var(--toc-ink);
  padding: var(--htmpres-ui-padding, 8px 11px);
}

.action-button {
  border-radius: var(--radius, 6px);
  background: var(--ink);
  color: var(--paper);
  padding: var(--htmpres-ui-padding, 9px 13px);
}

.control-chip:hover,
.control-chip:focus-visible,
.action-button:hover,
.action-button:focus-visible {
  outline: var(--htmpres-focus-outline, none);
  border-color: var(--teal);
}

.control-chip.active {
  background: var(--foundation-selected-fill, var(--amber));
  border-color: var(--amber);
  color: var(--foundation-selected-ink, var(--paper));
}

.action-button.active {
  background: var(--foundation-selected-fill, var(--teal));
  color: var(--foundation-selected-ink, var(--paper));
  border-color: var(--teal);
}

.focus-panel {
  margin-top: 18px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 18px;
  min-height: 180px;
}

.focus-panel h3 {
  color: var(--teal);
}

.checklist {
  margin-top: 24px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.checklist div {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  padding: 14px;
}

.checklist strong {
  display: block;
  margin-bottom: 6px;
}

.footer-controls {
  grid-column: 2;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto auto auto;
  align-items: center;
  gap: 10px;
  border-top: 1px solid var(--line);
  background: var(--paper);
  padding: 10px 22px;
}

.progress {
  height: 7px;
  background: var(--progress-track);
  border-radius: 999px;
  overflow: hidden;
}

.progress span {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--teal), var(--amber));
  transition: width 150ms ease;
}

.counter {
  color: var(--muted);
  font-size: 0.86rem;
  min-width: 68px;
  text-align: center;
}

.nav-btn {
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--paper);
  color: var(--ink);
  min-width: 58px;
  height: 38px;
  cursor: pointer;
  font-size: 1rem;
  padding: 0 12px;
}

.nav-btn:hover,
.nav-btn:focus-visible {
  outline: none;
  border-color: var(--teal);
  color: var(--teal);
}

.nav-btn.primary {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}

.overview {
  position: fixed;
  inset: 0;
  background: var(--overview-bg);
  z-index: 20;
  display: none;
  padding: 38px;
  overflow: auto;
}

.overview.visible {
  display: block;
}

.overview-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 14px;
}

.overview-card {
  border: 1px solid var(--overview-card-border);
  border-radius: var(--radius);
  background: var(--paper);
  min-height: 126px;
  padding: 16px;
  cursor: pointer;
}

.overview-card.active {
  outline: 4px solid var(--amber);
}

.overview-card small {
  color: var(--muted);
  display: block;
  margin-bottom: 8px;
}

.overview-card strong {
  line-height: 1.2;
}

.zoom-modal {
  position: fixed;
  inset: 0;
  background: var(--zoom-bg);
  z-index: 30;
  display: none;
  padding: 28px;
}

.zoom-modal.visible {
  display: grid;
  place-items: center;
}

.zoom-modal img {
  max-width: 96vw;
  max-height: 90vh;
  background: var(--paper);
  border-radius: var(--radius);
  padding: 8px;
}

.zoom-close {
  position: fixed;
  top: 18px;
  right: 18px;
  border: 1px solid var(--zoom-close-border);
  background: var(--zoom-close-bg);
  color: var(--paper);
  border-radius: 999px;
  padding: 8px 12px;
  cursor: pointer;
}

@media (max-width: 980px) {
  body {
    overflow: hidden;
  }

  .deck-shell {
    position: fixed;
    inset: 0;
    display: grid;
    grid-template-columns: 1fr;
    grid-template-rows: minmax(0, 1fr) var(--htmpres-mobile-footer-row);
    width: 100%;
    height: max(360px, calc(var(--htmpres-viewport-height, 100dvh) - var(--htmpres-mobile-browser-clearance, 0px)));
    max-height: max(360px, calc(var(--htmpres-viewport-height, 100dvh) - var(--htmpres-mobile-browser-clearance, 0px)));
    min-height: 0;
    overflow: hidden;
  }

  .toc {
    display: none;
  }

  .stage-wrap {
    align-items: stretch;
    min-height: 0;
    overflow: hidden;
    padding: 0;
  }

  .slide-fit,
  .slides {
    width: 100% !important;
    height: 100% !important;
  }

  .slides {
    max-height: none;
    aspect-ratio: auto;
    min-height: 0;
    border-radius: 0;
    transform: none !important;
  }

  .slide {
    padding: var(--htmpres-mobile-slide-padding, 30px 22px var(--htmpres-mobile-slide-bottom-clearance));
    overflow: auto;
    overscroll-behavior: contain;
    scroll-padding-bottom: var(--htmpres-mobile-slide-bottom-clearance);
    -webkit-overflow-scrolling: touch;
  }

  .two-col,
  .two-col.wide-left,
  .two-col.wide-right,
  .three-col,
  .four-col,
  .five-col,
  .flow,
  .timeline,
  .release-ladder,
  .story-layout,
  .story-steps,
  .story-stat-grid,
  .story-bridge,
  .url-pair,
  .profile-fragment-grid,
  .axis-map,
  .axis-map.six,
  .axis-map.eight,
  .kpi-grid,
  .mini-diagram,
  .checklist,
  .mixed-transition,
  .transition-strip,
  .feature-status {
    grid-template-columns: 1fr !important;
  }

  .two-col > *,
  .three-col > *,
  .four-col > *,
  .five-col > *,
  .flow > *,
  .timeline > *,
  .release-ladder > *,
  .story-layout > *,
  .story-steps > *,
  .story-stat-grid > *,
  .story-bridge > *,
  .url-pair > *,
  .profile-fragment-grid > *,
  .axis-map > *,
  .kpi-grid > *,
  .mini-diagram > *,
  .checklist > *,
  .mixed-transition > *,
  .transition-strip > *,
  .feature-status > *,
  .code-card,
  .lead,
  .callout,
  .source-line,
  .axis,
  .matrix {
    min-width: 0;
    max-width: 100%;
    box-sizing: border-box;
  }

  .chip-row > p {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin: 0;
  }

  .chip-row .chip {
    display: inline-flex;
    max-width: 100%;
  }

  .source-line {
    position: static;
    left: auto;
    right: auto;
    bottom: auto;
    display: block;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .source-line code {
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .code-card pre,
  .code-card code {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  code,
  .scheme-row code {
    overflow-wrap: anywhere;
    word-break: break-word;
  }

  .axis {
    grid-template-columns: 1fr !important;
  }

  .axis .bar {
    min-width: 0;
  }

  .diagram-frame {
    height: 320px;
  }

  .diagram-frame > img.zoomable {
    height: 296px !important;
  }

  h2,
  .hero-title h2 {
    font-size: var(--htmpres-h2-size, 2rem);
  }

  .footer-controls {
    grid-column: 1;
    grid-template-columns: minmax(48px, 1fr) auto auto auto auto;
    align-self: end;
    min-height: var(--htmpres-mobile-footer-row);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    padding-left: calc(12px + env(safe-area-inset-left, 0px));
    padding-right: calc(12px + env(safe-area-inset-right, 0px));
    position: relative;
    z-index: 10;
  }

  .nav-btn {
    min-width: 50px;
    height: 42px;
    padding: 0 10px;
  }

  .counter {
    min-width: 54px;
    font-size: 0.78rem;
  }
}

@media print {
  body {
    overflow: visible;
    background: var(--paper);
  }

  .deck-shell,
  .slides {
    display: block;
    width: auto;
    max-height: none;
    box-shadow: none;
  }

  .toc,
  .footer-controls,
  .overview,
  .zoom-modal {
    display: none !important;
  }

  .slide {
    position: relative;
    display: block !important;
    page-break-after: always;
    width: 1280px;
    height: 720px;
    border: 1px solid var(--print-border);
  }
}

/* Custom htmpres runtime overrides generated after the source deck CSS. */
.visually-hidden {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0 0 0 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}

body.audience-mode .slide .notes {
  display: none !important;
}

.htmpres-filter-defs {
  position: absolute;
  width: 0;
  height: 0;
  overflow: hidden;
}

.slide div.sourceCode,
.slide pre {
  max-width: 100%;
  overflow: auto;
}

.slide > div.sourceCode,
.slide > pre {
  margin-top: 24px;
  border: var(--htmpres-code-shell-border, 1px solid var(--htmpres-code-border, rgba(15, 23, 42, 0.16)));
  border-radius: var(--htmpres-code-radius, 8px);
  background: var(--htmpres-code-bg, #172127);
  color: var(--htmpres-code-ink, #eff6f4);
  padding: var(--htmpres-code-pad, 18px);
}

.slide div.sourceCode > pre,
.slide pre.sourceCode {
  margin: 0;
  border: 0;
  background: transparent;
  color: inherit;
  padding: 0;
  box-shadow: none;
}

.slide pre.sourceCode,
.slide pre.sourceCode code {
  white-space: pre;
}

.slide pre code {
  color: inherit;
  font-size: inherit;
  line-height: inherit;
}

.slide pre.numberSource code {
  counter-reset: source-line;
}

.slide pre.numberSource code > span,
.slide code > .code-line {
  display: inline-block;
  min-width: 100%;
  min-height: 1.45em;
  box-sizing: border-box;
  padding-left: 0.65rem;
  padding-right: 0.65rem;
  transition: background 140ms ease, box-shadow 140ms ease, opacity 140ms ease;
}

.slide pre.numberSource code > span {
  counter-increment: source-line;
  position: relative;
  padding-left: 3.1rem;
}

.slide pre.numberSource code > span > a:first-child {
  position: absolute;
  left: 0;
  width: 2.35rem;
  padding-right: 0.5rem;
  color: var(--htmpres-code-line-number, rgba(226, 232, 240, 0.46));
  text-align: right;
  text-decoration: none;
  user-select: none;
}

.slide pre.numberSource code > span > a:first-child::before {
  content: counter(source-line);
}

.slide .code-line-highlight {
  background: var(--htmpres-code-highlight-bg, rgba(193, 131, 34, 0.22));
  box-shadow: inset var(--htmpres-code-highlight-bar-width, 4px) 0 0 var(--htmpres-code-highlight-bar, rgba(193, 131, 34, 0.9));
}

.slide .code-step-active .code-line-dim {
  opacity: 0.42;
}

.slide.transition-fade.active,
.slide.transition-slide.active,
.slide.transition-zoom.active {
  animation-duration: var(--slide-transition-duration, 220ms);
  animation-fill-mode: both;
  animation-timing-function: ease;
}

.slide.transition-fade.active {
  animation-name: htmpres-slide-fade;
}

.slide.transition-slide.active {
  animation-name: htmpres-slide-next;
}

html[data-slide-direction="prev"] .slide.transition-slide.active {
  animation-name: htmpres-slide-prev;
}

.slide.transition-zoom.active {
  animation-name: htmpres-slide-zoom;
}

.slide.transition-none.active,
html[data-slide-direction="none"] .slide.transition-fade.active,
html[data-slide-direction="none"] .slide.transition-slide.active,
html[data-slide-direction="none"] .slide.transition-zoom.active {
  animation: none;
}

@keyframes htmpres-slide-fade {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes htmpres-slide-next {
  from {
    opacity: 0;
    transform: translateX(28px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes htmpres-slide-prev {
  from {
    opacity: 0;
    transform: translateX(-28px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes htmpres-slide-zoom {
  from {
    opacity: 0;
    transform: scale(0.985);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

.slide .fragment {
  opacity: 0;
  visibility: hidden;
  transform: translateY(var(--fragment-offset, 12px));
  transition:
    opacity var(--fragment-duration, 180ms) ease,
    transform var(--fragment-duration, 180ms) ease,
    filter var(--fragment-duration, 180ms) ease,
    background-color var(--fragment-duration, 180ms) ease,
    box-shadow var(--fragment-duration, 180ms) ease;
}

.slide .fragment.fragment-visible {
  opacity: 1;
  visibility: visible;
  transform: none;
}

.slide .fragment.fragment-none {
  transition: none;
  transform: none;
}

.slide .fragment.fragment-scale:not(.fragment-visible) {
  transform: scale(0.96);
}

.slide .fragment.fragment-left:not(.fragment-visible) {
  transform: translateX(-18px);
}

.slide .fragment.fragment-right:not(.fragment-visible) {
  transform: translateX(18px);
}

.slide .fragment.fragment-rise:not(.fragment-visible),
.slide .fragment.fragment-slide:not(.fragment-visible) {
  transform: translateY(18px);
}

.slide .fragment.fragment-blur:not(.fragment-visible) {
  filter: blur(4px);
}

.slide .fragment.fragment-highlight.fragment-current {
  background: var(--htmpres-fragment-highlight-bg, rgba(193, 131, 34, 0.14));
  box-shadow: inset var(--htmpres-fragment-highlight-bar-width, 4px) 0 0 var(--htmpres-fragment-highlight-bar, rgba(193, 131, 34, 0.75));
}

.slide .fragment.fragment-dim.fragment-past {
  opacity: 0.42;
}

.slide .fragment.fragment-dim.fragment-current {
  opacity: 1;
}

.slide.htmpres-text-fit-active {
  --htmpres-text-fit-scale: 1;
}

.slide.htmpres-text-fit-active h2 {
  font-size: calc(var(--htmpres-h2-size, 2.35rem) * var(--htmpres-text-fit-scale));
}

.slide.htmpres-text-fit-active .hero-title h2 {
  font-size: calc(var(--htmpres-hero-title-size, 3rem) * var(--htmpres-text-fit-scale));
}

.slide.htmpres-text-fit-active h3 {
  font-size: calc(var(--htmpres-h3-size, 1.18rem) * var(--htmpres-text-fit-scale));
}

.slide.htmpres-text-fit-active p,
.slide.htmpres-text-fit-active li,
.slide.htmpres-text-fit-active .card,
.slide.htmpres-text-fit-active .lead,
.slide.htmpres-text-fit-active .callout {
  font-size: calc(var(--htmpres-body-size, 1rem) * var(--htmpres-text-fit-scale));
}

.slide.htmpres-text-fit-active .eyebrow,
.slide.htmpres-text-fit-active .source-line {
  font-size: calc(var(--htmpres-small-size, 0.78rem) * var(--htmpres-text-fit-scale));
}

.slide.htmpres-text-fit-active pre {
  font-size: calc(var(--htmpres-code-size, 0.9rem) * var(--htmpres-text-fit-scale));
}

.slide[data-overflow="scroll"],
html[data-overflow="scroll"] .slide,
.slide[data-overflow="fit-scroll"].htmpres-text-fit-overflow,
html[data-overflow="fit-scroll"] .slide.htmpres-text-fit-overflow {
  overflow: auto;
  overscroll-behavior: contain;
}

.slide[data-overflow="hidden"],
html[data-overflow="hidden"] .slide,
.slide[data-overflow="fit"],
html[data-overflow="fit"] .slide {
  overflow: hidden;
}

.scroll-cue {
  position: absolute;
  left: 50%;
  bottom: 18px;
  z-index: 9;
  display: grid;
  place-items: center;
  width: 44px;
  height: 26px;
  border: 1px solid rgba(255, 255, 255, 0.34);
  border-radius: 999px;
  background: rgba(17, 24, 39, 0.82);
  box-shadow: 0 8px 20px rgba(15, 23, 42, 0.24);
  opacity: 0;
  pointer-events: none;
  transform: translate(-50%, 6px);
  transition: opacity 160ms ease, transform 160ms ease;
}

.scroll-cue[hidden] {
  display: none;
}

.slides.scroll-cue-visible .scroll-cue {
  opacity: 0.92;
  transform: translate(-50%, 0);
}

.scroll-cue::before {
  content: "";
  width: 9px;
  height: 9px;
  margin-top: -4px;
  border-right: 2px solid #ffffff;
  border-bottom: 2px solid #ffffff;
  transform: rotate(45deg);
  animation: htmpres-scroll-cue 1300ms ease-in-out infinite;
}

@keyframes htmpres-scroll-cue {
  0%,
  100% {
    opacity: 0.45;
    transform: translateY(-2px) rotate(45deg);
  }
  50% {
    opacity: 1;
    transform: translateY(3px) rotate(45deg);
  }
}

@media (prefers-reduced-motion: reduce) {
  .slide.transition-fade.active,
  .slide.transition-slide.active,
  .slide.transition-zoom.active {
    animation: none;
  }

  .slide .fragment {
    transition: none;
    transform: none;
  }

  .scroll-cue::before {
    animation: none;
  }
}

@media print {
  .slide .fragment {
    opacity: 1 !important;
    visibility: visible !important;
    transform: none !important;
    filter: none !important;
  }
}

/* Semantic importance; themes may remap any level without changing QMD. */
:root {
  --htmpres-importance-0-scale: .8;
  --htmpres-importance-0-weight: 400;
  --htmpres-importance-0-ink: var(--muted, currentColor);
  --htmpres-importance-1-scale: .9;
  --htmpres-importance-1-weight: 400;
  --htmpres-importance-1-ink: var(--muted, currentColor);
  --htmpres-importance-2-scale: 1;
  --htmpres-importance-2-weight: 400;
  --htmpres-importance-2-ink: var(--ink, currentColor);
  --htmpres-importance-3-scale: 1.12;
  --htmpres-importance-3-weight: 700;
  --htmpres-importance-3-ink: var(--ink, currentColor);
  --htmpres-importance-4-scale: 1.3;
  --htmpres-importance-4-weight: 800;
  --htmpres-importance-4-ink: var(--ink, currentColor);
}

:is(.slide, .presenter-note-body) .key {
  --htmpres-importance-scale: var(--htmpres-importance-3-scale);
  --htmpres-importance-weight: var(--htmpres-importance-3-weight);
  --htmpres-importance-ink: var(--htmpres-importance-3-ink);
}

:is(.slide, .presenter-note-body) .aside {
  --htmpres-importance-scale: var(--htmpres-importance-1-scale);
  --htmpres-importance-weight: var(--htmpres-importance-1-weight);
  --htmpres-importance-ink: var(--htmpres-importance-1-ink);
}

:is(.slide, .presenter-note-body) :is(.key, .aside) {
  font-size: calc(1em * var(--htmpres-importance-scale));
  font-weight: var(--htmpres-importance-weight);
  color: var(--htmpres-importance-ink);
}

/* Block roles start from the theme's body size and retain runtime text fitting. */
:is(.slide, .presenter-note-body) :is(div, section, aside, blockquote):is(.key, .aside),
.slide.htmpres-text-fit-active :is(div, section, aside, blockquote):is(.key, .aside) {
  font-size: calc(var(--htmpres-body-size, 1rem) * var(--htmpres-importance-scale) * var(--htmpres-text-fit-scale, 1));
}

:is(.slide, .presenter-note-body) :is(.key, .aside) :is(p, ul, ol, li) {
  font-size: inherit;
  font-weight: inherit;
  color: inherit;
}

/* Only named terms participate in equation steps. Future text fragments remain
   hidden by the shell's fragment rules; this never previews unread text. */
.slide .equation-term {
  transition: opacity var(--fragment-duration, 180ms) ease,
    background-color var(--fragment-duration, 180ms) ease;
}

.slide .equation-term-dim {
  opacity: 0.35;
}

.slide .equation-term-highlight {
  opacity: 1;
  background: var(--htmpres-fragment-highlight-bg, rgba(193, 131, 34, 0.14));
  border-radius: 0.12em;
}

/* Summary colors appear only after the final shared frame. Named CSS tokens
   override generated slots; code glyphs retain their syntax colors. */
.slide.step-summary-active [data-match-slot]:not(.code-line) {
  color: var(--_htmpres-match-ink);

      state.fragments.forEach((fragment) => {

        // text point makes it past; code must not dim every explanation at once.
        const currentFragment = visible && fragment.index === latest && latest > 0;
        fragment.element.classList.toggle("fragment-visible", visible);
        fragment.element.classList.toggle("fragment-current", currentFragment);

    function prepareCodeSteppers() {
      slides.forEach((slide) => {

          if (root.matches("pre, code") && root.closest("div.sourceCode[data-highlight], div.sourceCode[data-steps], div.sourceCode[data-highlight-steps], div.sourceCode[data-match-ranges]")) return;

          const code = root.matches("code") ? root : root.querySelector("code");
          if (!code) return;

          const lines = codeLineNodes(code);
          if (!lines.length) return;

          const highlight = getCodeData(root, code, "highlight");
          const steps = getCodeData(root, code, "steps") || getCodeData(root, code, "highlightSteps");
          const staticLines = parseLineSelection(highlight, lines.length);
          const stepLines = parseStepSelections(steps, lines.length);
          if (!staticLines.size && !stepLines.length && !getCodeData(root, code, "matchRanges")) return;

          root.classList.add("code-stepper");
          const stepIndices = parseStepIndices(getCodeData(root, code, "stepIndices"), stepLines.length, root);
          blocks.push({ root, lines, staticLines, stepLines, stepIndices, matchRanges: getCodeData(root, code, "matchRanges") });
        });

        if (!blocks.length) return;
        slideCodeStates.set(slide, {
          blocks,
          maxSteps: Math.max(...blocks.map((block) => block.stepLines.length)),
          step: 0,
        });
      });
    }

    function hasCodeDirective(root) {
      return Boolean(root.dataset.highlight || root.dataset.steps || root.dataset.highlightSteps || root.dataset.matchRanges);
    }

    function getCodeData(root, code, key) {
      const pre = code.closest("pre");
      return root.dataset[key] || pre?.dataset[key] || code.dataset[key] || "";
    }

    function codeLineNodes(code) {
      const pandocLines = Array.from(code.children).filter((child) => {
        if (child.tagName !== "SPAN") return false;
        return Boolean(child.dataset.line || /-\d+$/.test(child.id || ""));
      });

      const lines = pandocLines.length ? pandocLines : wrapPlainCodeLines(code);
      lines.forEach((line, index) => {
        line.classList.add("code-line");
        line.dataset.line = String(lineNumber(line, index));
      });
      return lines;
    }

    function wrapPlainCodeLines(code) {
      const text = code.textContent || "";
      const hadTrailingNewline = /\n$/.test(text);
      const parts = text.replace(/\n$/, "").split("\n");
      code.textContent = "";
      const lines = parts.map((part, index) => {
        const line = document.createElement("span");
        line.textContent = part || "\u200b";
        code.appendChild(line);
        if (index < parts.length - 1 || hadTrailingNewline) code.appendChild(document.createTextNode("\n"));
        return line;
      });
      return lines;
    }

    function lineNumber(line, index) {
      const dataLine = Number(line.dataset.line);
      if (Number.isFinite(dataLine) && dataLine > 0) return dataLine;
      const match = /-(\d+)$/.exec(line.id || "");
      return match ? Number(match[1]) : index + 1;
    }

    function parseStepSelections(value, lineCount) {
      if (!value) return [];
      return value.split("|").map((part) => parseLineSelection(part, lineCount));
    }

    function parseLineSelection(value, lineCount) {
      const selected = new Set();
      const raw = (value || "").trim().toLowerCase();
      if (!raw || raw === "none") return selected;
      if (raw === "all") {
        for (let line = 1; line <= lineCount; line += 1) selected.add(line);
        return selected;
      }

      raw.split(/[,\s]+/).forEach((part) => {
        if (!part) return;
        const range = /^(\d+)-(\d+)$/.exec(part);
        if (range) {
          const start = Math.max(1, Math.min(Number(range[1]), Number(range[2])));
          const end = Math.min(lineCount, Math.max(Number(range[1]), Number(range[2])));
          for (let line = start; line <= end; line += 1) selected.add(line);
          return;
        }
        const line = Number(part);
        if (Number.isInteger(line) && line >= 1 && line <= lineCount) selected.add(line);
      });
      return selected;
    }

    function parseStepIndices(value, count, root) {
      if (!value) return null;
      const parts = value.split("|").map((part) => part.trim());
      const indices = parts.map(Number);
      if (indices.length === count && parts.every((part) => /^\d+$/.test(part)) && indices.every((index, offset) => Number.isSafeInteger(index) && index > 0 && (offset === 0 || index > indices[offset - 1]))) return indices;
      if (root) root.dataset.stepError = "invalid-step-indices";
      console.warn("htmpres: data-step-indices must contain one strictly increasing positive integer per snapshot; using implicit source order.", root);
      return null;
    }

    function prepareEquationSteppers() {
      slides.forEach((slide) => {
        const blocks = [];
        slide.querySelectorAll(".equation-steps[data-equation-steps]").forEach((root) => {
          const stepTerms = root.dataset.equationSteps.split("|").map((part) => new Set(part.split(/[,\s]+/).filter((term) => /^-?[_a-zA-Z]+[_a-zA-Z0-9-]*$/.test(term))));
          if (!stepTerms.length) return;
          const termNames = [...new Set(stepTerms.flatMap((terms) => [...terms]))];
          const stepIndices = parseStepIndices(root.dataset.stepIndices, stepTerms.length, root);
          blocks.push({ root, stepTerms, termNames, stepIndices });
        });
        if (blocks.length) slideEquationStates.set(slide, { blocks });
      });
    }

    function applyEquationStep(slide) {
      const state = slideEquationStates.get(slide);
      if (!state) return;
      state.blocks.forEach((block) => {
        const active = !slide.classList.contains("step-summary-active") && block.activeSnapshot >= 0 ? block.stepTerms[block.activeSnapshot] : null;
        const selector = block.termNames.map((term) => `.${term}`).join(", ");
        if (selector) block.root.querySelectorAll(selector).forEach((term) => {
          const selected = active && [...active].some((name) => term.classList.contains(name));
          term.classList.add("equation-term");
          term.classList.toggle("equation-term-highlight", Boolean(selected));
          term.classList.toggle("equation-term-dim", Boolean(active && active.size && !selected));
        });
        block.root.classList.toggle("equation-step-active", Boolean(active));
        if (active) block.root.dataset.activeStep = String(block.activeSnapshot + 1);
        else delete block.root.dataset.activeStep;
      });
    }

    function applyCodeStep(slide) {
      const state = slideCodeStates.get(slide);
      if (!state) return;

      state.blocks.forEach((block) => {
        const snapshot = block.activeSnapshot ?? Math.min(state.step, block.stepLines.length - 1);
        const summary = slide.classList.contains("step-summary-active");
        const stepSet = !summary && snapshot >= 0 && block.stepLines.length ? block.stepLines[snapshot] : null;
        const activeLines = new Set(summary ? [] : block.staticLines);
        if (stepSet) stepSet.forEach((line) => activeLines.add(line));
        const shouldDim = Boolean(stepSet && activeLines.size);

        block.lines.forEach((line) => {
          const active = activeLines.has(Number(line.dataset.line));
          line.classList.toggle("code-line-highlight", active);
          line.classList.toggle("code-line-dim", shouldDim && !active);
        });

        block.root.classList.toggle("code-step-active", Boolean(stepSet));
        if (stepSet) {
          block.root.dataset.activeStep = String(snapshot + 1);
        } else {
          delete block.root.dataset.activeStep;
        }
      });
    }

    function canAdvanceSlide() {
      return current < slides.length - 1 && !(mainSlideCount > 0 && current === lastMainSlide);
    }

    function advanceSlide() {
      if (canAdvanceSlide()) goTo(current + 1);
    }

    function updateNavigationButtons() {
      const state = slideStepStates.get(slides[current]);
      if (prevBtn) prevBtn.disabled = current === 0 && !state?.cursor;
      if (nextBtn) nextBtn.disabled = !canAdvanceSlide() && (!state || state.cursor >= state.frames.length);
    }

    function nextStepOrSlide() {
      if (changeSlideStep(1)) return;
      advanceSlide();
    }

    function prevStepOrSlide() {
      if (changeSlideStep(-1)) return;
      goTo(current - 1);
    }

    function updateNotes() {
      const noteHtml = deckNotes[current] || "";
      if (presenterNotes) {
        presenterNotes.innerHTML = noteHtml || '<p class="presenter-note-empty">No presenter notes for this slide.</p>';
        window.htmpresRenderMath?.(presenterNotes);
      }
      if (!notesBox) return;
      const note = slides[current]?.querySelector(".notes");
      notesBox.innerHTML = noteHtml || (note ? note.innerHTML : "No speaker notes for this slide.");
      window.htmpresRenderMath?.(notesBox);
    }

    function toggleNotes() {
      if (!notesBox) return;
      notesBox?.classList.toggle("visible");
    }

    function toggleOverview() {
      overview?.classList.toggle("visible");
    }

    function closeOverlays() {
      overview?.classList.remove("visible");
      zoom?.classList.remove("visible");
      notesBox?.classList.remove("visible");
    }

    function wireZoom() {
      document.querySelectorAll(".zoomable").forEach((image) => {
        image.addEventListener("click", () => {
          if (!zoom || !zoomImg) return;
          zoomImg.src = image.currentSrc || image.src;
          zoomImg.alt = image.alt || "Zoomed diagram";
          zoom.classList.add("visible");
        });
      });
      zoomClose?.addEventListener("click", () => zoom?.classList.remove("visible"));
      zoom?.addEventListener("click", (event) => {
        if (event.target === zoom) zoom.classList.remove("visible");
      });
    }

    function wireTapNavigation() {
      if (!slideFit) return;

      let touchStart = null;
      let suppressClickUntil = 0;
      const swipeDistance = 48;
      const swipeVerticalTolerance = 0.8;
      const swipeMaxDuration = 800;

      slideFit.addEventListener("click", (event) => {
        if (performance.now() < suppressClickUntil) return;
        if (event.defaultPrevented || ("button" in event && event.button !== 0) || interactiveTapTarget(event.target)) return;
        const rect = slideFit.getBoundingClientRect();
        if (!rect.width) return;
        const x = event.clientX - rect.left;
        if (x < rect.width * 0.28) {
          prevStepOrSlide();
        } else {
          nextStepOrSlide();
        }
      });

      slideFit.addEventListener("touchstart", (event) => {
        if (event.touches.length !== 1 || interactiveTapTarget(event.target)) {
          touchStart = null;
          return;
        }
        const touch = event.touches[0];
        touchStart = {
          x: touch.clientX,
          y: touch.clientY,
          time: performance.now(),
        };
      }, { passive: true });

      slideFit.addEventListener("touchend", (event) => {
        if (!touchStart || interactiveTapTarget(event.target)) {
          touchStart = null;
          return;
        }
        const touch = event.changedTouches[0];
        if (!touch) {
          touchStart = null;
          return;
        }
        const dx = touch.clientX - touchStart.x;
        const dy = touch.clientY - touchStart.y;
        const duration = performance.now() - touchStart.time;
        touchStart = null;
        if (Math.abs(dx) < swipeDistance) return;
        if (Math.abs(dy) > Math.abs(dx) * swipeVerticalTolerance) return;
        if (duration > swipeMaxDuration) return;
        suppressClickUntil = performance.now() + 650;
        if (dx < 0) {
          nextStepOrSlide();
        } else {
          prevStepOrSlide();
        }
      }, { passive: true });

      slideFit.addEventListener("touchcancel", () => {
        touchStart = null;
      }, { passive: true });
    }

    function interactiveTapTarget(target) {
      if (!(target instanceof Element)) return false;
      return Boolean(target.closest(
        "a, button, input, select, textarea, summary, label, pre, code, video, audio, iframe, object, embed, [contenteditable], [role='button'], .sourceCode, .zoomable, .no-tap-nav, .no-slide-nav, [data-no-tap-nav], [data-no-slide-nav]",
      ));
    }

    function wireMediaDirectives() {
      document.querySelectorAll("video, audio").forEach((media) => {
        if (media.classList.contains("ds-controls")) media.setAttribute("controls", "");
        if (media.classList.contains("ds-autoplay")) media.setAttribute("autoplay", "");
        if (media.classList.contains("ds-loop")) media.setAttribute("loop", "");
        if (media.classList.contains("ds-muted")) {
          media.muted = true;
          media.setAttribute("muted", "");
        }
        if (media.classList.contains("ds-hide")) media.setAttribute("aria-hidden", "true");
        if (media.classList.contains("ds-autoadvance")) {
          media.addEventListener("ended", () => {
            if (slides[current]?.contains(media)) advanceSlide();
          });
        }
      });
    }

    function syncSlideMedia() {
      slides.forEach((slide, index) => {
        slide.querySelectorAll("video, audio").forEach((media) => {
          if (index === current) {
            if (media.classList.contains("ds-autoplay")) media.play?.().catch(() => {});
            return;
          }
          media.pause?.();
          if (!media.classList.contains("ds-keep-time")) {
            try {
              media.currentTime = 0;
            } catch {
              // Some streaming sources do not allow seeking until metadata loads.
            }
          }
        });
      });
    }

    function readDeckNotes() {
      const node = document.getElementById("deckNotes");
      if (!node) return [];
      try {
        const parsed = JSON.parse(node.textContent || "[]");
        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function slideTargetFromHash(hash) {
      const numeric = /^#\/(\d+)$/.exec(hash);
      if (numeric) {
        const index = Number(numeric[1]) - 1;
        return index >= 0 && index < slides.length ? { index, target: null } : null;
      }
      let id;
      try { id = decodeURIComponent(hash.replace(/^#/, "")); } catch { return null; }
      if (!id) return null;
      const target = document.getElementById(id);
      const slide = target?.closest(".slide");
      const index = slides.indexOf(slide);
      return index >= 0 ? { index, target: target === slide ? null : target } : null;
    }

    function navigateToHash(hash, historyMode = "none") {
      const destination = slideTargetFromHash(hash);
      if (!destination) return false;
      goTo(destination.index, { history: historyMode, hash });
      destination.target?.scrollIntoView?.({ block: "nearest" });
      return true;
    }

    function wireHashNavigation() {
      window.addEventListener("hashchange", () => navigateToHash(location.hash));
      document.addEventListener("click", (event) => {
        if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
        const anchor = event.target instanceof Element ? event.target.closest("a[href]") : null;
        if (!anchor || anchor.hasAttribute("download") || (anchor.target && anchor.target !== "_self")) return;
        const url = new URL(anchor.href, location.href);
        if (url.origin !== location.origin || url.pathname !== location.pathname || url.search !== location.search || !url.hash) return;
        if (!slideTargetFromHash(url.hash)) return;
        event.preventDefault();
        navigateToHash(url.hash, "push");
      });
    }

    prevBtn?.addEventListener("click", prevStepOrSlide);
    nextBtn?.addEventListener("click", nextStepOrSlide);
    overviewBtn?.addEventListener("click", toggleOverview);
    overview?.addEventListener("click", (event) => {
      if (event.target === overview) overview.classList.remove("visible");
    });
    window.addEventListener("resize", scheduleViewportLayout);
    window.addEventListener("orientationchange", scheduleViewportLayout);
    window.visualViewport?.addEventListener("resize", scheduleViewportLayout);
    window.visualViewport?.addEventListener("scroll", scheduleViewportLayout);
    window.addEventListener("load", scheduleTextFit);
    document.fonts?.ready?.then(scheduleTextFit)?.catch(() => {});
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" || event.key === " " || event.key === "PageDown") {
        event.preventDefault();
        nextStepOrSlide();
      }
      if (event.key === "ArrowLeft" || event.key === "PageUp") {
        event.preventDefault();
        prevStepOrSlide();
      }
      if (event.key === "Home") goTo(0);
      if (event.key === "End") goTo(lastMainSlide);
      if (event.key.toLowerCase() === "o") toggleOverview();
      if (event.key.toLowerCase() === "n") toggleNotes();
      if (event.key === "Escape") closeOverlays();
      if (event.key.toLowerCase() === "f" && document.fullscreenEnabled) {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      }
    });

    updateViewportHeight();
    buildNav();
    wireZoom();
    wireScrollCue();
    wireTapNavigation();
    wireMediaDirectives();
    wireHashNavigation();
    prepareSlideTransitions();
    prepareFragments();
    prepareCodeSteppers();
    prepareEquationSteppers();
    prepareStepGraphs();
    scaleDeck();
    if (!navigateToHash(location.hash)) goTo(0);

  </script>
  <script>
(() => {
  function currentSlideFor(node) {
    return node.closest(".slide") || node.closest(".reveal .slides section") || document;
  }

  function scopedQuery(node, selector) {
    const slide = currentSlideFor(node);
    return slide.querySelector(selector) || document.querySelector(selector);
  }

  function setActive(control) {
    const group = control.closest(".pill-row") || control.closest("[data-choice-group]");
    if (!group) return;
    group.querySelectorAll(".active").forEach((item) => item.classList.remove("active"));
    control.classList.add("active");
  }

  function writePanel(panel, title, text, html) {
    if (!panel) return;
    if (html) {
      panel.innerHTML = html;
      return;
    }
    panel.innerHTML = "";
    if (title) {
      const heading = document.createElement("h3");
      heading.textContent = title;
      panel.appendChild(heading);
    }
    if (text) {
      const para = document.createElement("p");
      para.textContent = text;
      panel.appendChild(para);
    }
  }

  function activateGeneric(control) {
    const selector = control.dataset.target || control.dataset.updateTarget;
    if (!selector) return false;
    const panel = scopedQuery(control, selector);
    writePanel(panel, control.dataset.title, control.dataset.text, control.dataset.html);
    setActive(control);
    return true;
  }

  function activateFilter(control) {
    const filter = control.dataset.filter || control.dataset.itemFilter;
    const selector = control.dataset.filterTarget;
    if (!filter || !selector) return false;
    const slide = currentSlideFor(control);
    slide.querySelectorAll(selector).forEach((item) => {
      const values = (item.dataset.filter || item.dataset.tags || "").split(/\s+/);
      item.hidden = filter !== "all" && !values.includes(filter);
    });
    setActive(control);
    return true;
  }

  function makeInteractive(control, handler) {
    if (!control.matches("button")) {
      control.setAttribute("role", control.getAttribute("role") || "button");
      control.setAttribute("tabindex", control.getAttribute("tabindex") || "0");
    }
    control.addEventListener("click", handler);
    control.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        handler(event);
      }
    });
  }

  function wirePanelControls() {
    document.querySelectorAll("[data-target], [data-update-target]").forEach((control) => {
      makeInteractive(control, () => activateGeneric(control));
    });
    document.querySelectorAll("[data-filter], [data-item-filter]").forEach((control) => {
      makeInteractive(control, () => activateFilter(control));
    });
  }

  function ensureZoomModal() {
    let modal = document.getElementById("htmpresZoom");
    if (modal) return modal;
    modal = document.createElement("div");
    modal.id = "htmpresZoom";
    modal.className = "htmpres-zoom";
    modal.innerHTML = '<button type="button" aria-label="Close zoom">Close</button><img alt="">';
    document.body.appendChild(modal);
    modal.querySelector("button").addEventListener("click", () => modal.classList.remove("visible"));
    modal.addEventListener("click", (event) => {
      if (event.target === modal) modal.classList.remove("visible");
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") modal.classList.remove("visible");
    });
    return modal;
  }

  function wireZoom() {
    if (document.getElementById("zoom") || document.getElementById("zoomImg")) return;
    const modal = ensureZoomModal();
    const modalImage = modal.querySelector("img");
    document.querySelectorAll("img.zoomable, .zoomable img").forEach((image) => {
      image.addEventListener("click", () => {
        modalImage.src = image.currentSrc || image.src;
        modalImage.alt = image.alt || "Zoomed slide image";
        modal.classList.add("visible");
      });
    });
  }

  function init() {
    wirePanelControls();
    wireZoom();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
