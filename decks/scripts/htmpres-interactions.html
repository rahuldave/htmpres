<script>
(() => {
  function currentSlideFor(node) {
    return node.closest(".slide") || node.closest(".reveal .slides section") || document;
  }

  function scopedQuery(node, selector) {
    const slide = currentSlideFor(node);
    return slide.querySelector(selector) || document.querySelector(selector);
  }

  function setActive(control) {
    const group = control.closest(".pill-row") || control.closest("[data-choice-group]");
    if (!group) return;
    group.querySelectorAll(".active").forEach((item) => item.classList.remove("active"));
    control.classList.add("active");
  }

  function writePanel(panel, title, text, html) {
    if (!panel) return;
    if (html) {
      panel.innerHTML = html;
      return;
    }
    panel.innerHTML = "";
    if (title) {
      const heading = document.createElement("h3");
      heading.textContent = title;
      panel.appendChild(heading);
    }
    if (text) {
      const para = document.createElement("p");
      para.textContent = text;
      panel.appendChild(para);
    }
  }

  function activateGeneric(control) {
    const selector = control.dataset.target || control.dataset.updateTarget;
    if (!selector) return false;
    const panel = scopedQuery(control, selector);
    writePanel(panel, control.dataset.title, control.dataset.text, control.dataset.html);
    setActive(control);
    return true;
  }

  function activateFilter(control) {
    const filter = control.dataset.filter || control.dataset.itemFilter;
    const selector = control.dataset.filterTarget;
    if (!filter || !selector) return false;
    const slide = currentSlideFor(control);
    slide.querySelectorAll(selector).forEach((item) => {
      const values = (item.dataset.filter || item.dataset.tags || "").split(/\s+/);
      item.hidden = filter !== "all" && !values.includes(filter);
    });
    setActive(control);
    return true;
  }

  function makeInteractive(control, handler) {
    if (!control.matches("button")) {
      control.setAttribute("role", control.getAttribute("role") || "button");
      control.setAttribute("tabindex", control.getAttribute("tabindex") || "0");
    }
    control.addEventListener("click", handler);
    control.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        handler(event);
      }
    });
  }

  function wirePanelControls() {
    document.querySelectorAll("[data-target], [data-update-target]").forEach((control) => {
      makeInteractive(control, () => activateGeneric(control));
    });
    document.querySelectorAll("[data-filter], [data-item-filter]").forEach((control) => {
      makeInteractive(control, () => activateFilter(control));
    });
  }

  function ensureZoomModal() {
    let modal = document.getElementById("htmpresZoom");
    if (modal) return modal;
    modal = document.createElement("div");
    modal.id = "htmpresZoom";
    modal.className = "htmpres-zoom";
    modal.innerHTML = '<button type="button" aria-label="Close zoom">Close</button><img alt="">';
    document.body.appendChild(modal);
    modal.querySelector("button").addEventListener("click", () => modal.classList.remove("visible"));
    modal.addEventListener("click", (event) => {
      if (event.target === modal) modal.classList.remove("visible");
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") modal.classList.remove("visible");
    });
    return modal;
  }

  function wireZoom() {
    if (document.getElementById("zoom") || document.getElementById("zoomImg")) return;
    const modal = ensureZoomModal();
    const modalImage = modal.querySelector("img");
    document.querySelectorAll("img.zoomable, .zoomable img").forEach((image) => {
      image.addEventListener("click", () => {
        modalImage.src = image.currentSrc || image.src;
        modalImage.alt = image.alt || "Zoomed slide image";
        modal.classList.add("visible");
      });
    });
  }

  function init() {
    wirePanelControls();
    wireZoom();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
