<!doctype html><html lang="en"><meta charset="utf-8"><title>Local interactive page</title><style>:root{color-scheme:light dark;font-family:system-ui}body{padding:1.5rem;font-size:1.25rem}button{font:inherit;padding:.5em}output{display:block;margin-top:1rem}</style><h1>A local embedded page</h1><p>The button belongs to this page. Selecting it does not advance the deck.</p><button type="button" id="count">Add an observation</button><output id="value" aria-live="polite">0 observations</output><script>let count=0;document.getElementById('count').addEventListener('click',()=>{count++;document.getElementById('value').textContent=count+' '+(count===1?'observation':'observations');});</script></html>
